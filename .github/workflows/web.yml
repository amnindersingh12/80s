name: Web player (web/)

on:
    push:
        paths:
            - "web/**"
            - ".github/workflows/web.yml"
    pull_request:
        paths:
            - "web/**"
            - ".github/workflows/web.yml"
    workflow_dispatch:

jobs:
    test-and-build:
        name: Test & build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: web/package-lock.json

            -   name: Install dependencies
                run: npm ci

            -   name: Type-check
                run: npm run typecheck

            -   name: Unit tests
                run: npm test
                env:
                    TEST_REDIS_URL: redis://localhost:6379

            -   name: Build client and server
                run: npm run build

    docker:
        name: Docker image
        runs-on: ubuntu-latest
        needs: test-and-build
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Build image
                run: docker build -t 80s-web:ci web

            -   name: Smoke test (demo mode healthcheck)
                run: |
                    docker run -d --name web -p 8787:8787 80s-web:ci
                    for i in $(seq 1 30); do
                        curl -fsS http://127.0.0.1:8787/api/health && exit 0
                        sleep 1
                    done
                    docker logs web
                    exit 1
