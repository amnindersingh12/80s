name: Android debug APK

# Builds an installable debug APK (foss flavor, arm64-v8a + x86_64) and uploads it as an
# artifact: Actions → this run → Artifacts → felicity-foss-debug-apk.
on:
    push:
        branches:
            - feature/streaming-api
        paths-ignore:
            - "web/**"
            - "**/*.md"
    workflow_dispatch:

concurrency:
    group: android-apk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    assemble-debug:
        name: assembleFossDebug
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            # The modules compile with sourceCompatibility/jvmTarget 21 (common.gradle), so a
            # JDK 17 can't build them; 21 matches the repo's release workflows.
            -   name: Set up Java 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Set up Gradle (with cache)
                uses: gradle/actions/setup-gradle@v4

            -   name: Install Android SDK packages (platform 37, NDK, CMake)
                run: |
                    yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
                    NDK=$(grep -oP "ndk = '\K[^']+" gradle/libs.versions.toml)
                    "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                      "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK" "cmake;3.22.1" > /dev/null

            -   name: Unit tests (:remote)
                run: |
                    chmod +x ./gradlew
                    ./gradlew :remote:test

            -   name: Build debug APK
                run: ./gradlew :music:assembleFossDebug

            -   name: Upload APK
                uses: actions/upload-artifact@v4
                with:
                    name: felicity-foss-debug-apk
                    path: music/build/outputs/apk/foss/debug/*.apk
                    if-no-files-found: error
                    retention-days: 14
